name: Blueprint Pages

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pages:
    uses: ./.github/workflows/blueprint-pages.yml
    secrets: inherit
    with:
      warm_dependency_cache: true
      cloudflare_project_name: multilinear-interpolation
      production_branch: main
