name: Blueprint Pages Reusable

on:
  workflow_call:
    inputs:
      checkout_submodules:
        required: false
        type: boolean
        default: false
      harness_enabled:
        required: false
        type: boolean
        default: false
      warm_dependency_cache:
        required: false
        type: boolean
        default: false
      cloudflare_project_name:
        description: Name of the Cloudflare Pages project to deploy into.
        required: false
        type: string
        default: multilinear-interpolation
      production_branch:
        description: Branch that Cloudflare Pages treats as production (must match the project setting).
        required: false
        type: string
        default: main
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        required: false

permissions:
  contents: read

concurrency:
  group: ${{ github.repository }}-blueprint-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Blueprint Site
    runs-on: ubuntu-latest
    steps:
      - if: ${{ inputs.checkout_submodules }}
        uses: actions/checkout@v5
        with:
          submodules: recursive
      - if: ${{ !inputs.checkout_submodules }}
        uses: actions/checkout@v5
      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - if: ${{ inputs.harness_enabled }}
        name: Read harness config
        id: harness
        run: python3 tools/verso-harness/scripts/export_ci_env.py --project-root . >> "$GITHUB_OUTPUT"
      - name: Restore Lake package cache
        uses: actions/cache@v5
        with:
          path: |
            .lake/packages
          key: ${{ runner.os }}-lake-packages-v2-${{ hashFiles('lean-toolchain', 'lake-manifest.json', '.gitmodules') }}
          restore-keys: |
            ${{ runner.os }}-lake-packages-v2-
      - name: Restore root Lean build cache
        uses: actions/cache@v5
        with:
          path: |
            .lake/build/lib
            .lake/build/ir
          key: ${{ runner.os }}-lean-build-v2-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml', '.gitmodules', '*.lean', '**/*.lean', 'scripts/ci-pages.sh') }}
          restore-keys: |
            ${{ runner.os }}-lean-build-v2-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml', '.gitmodules') }}-
            ${{ runner.os }}-lean-build-v2-
      - if: ${{ inputs.harness_enabled }}
        name: Restore formalization Lean build cache
        uses: actions/cache@v5
        with:
          path: |
            ${{ steps.harness.outputs.formalization_path }}/.lake/build/lib
            ${{ steps.harness.outputs.formalization_path }}/.lake/build/ir
          key: ${{ runner.os }}-formalization-build-v1-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml', '.gitmodules', '*.lean', '**/*.lean', 'scripts/ci-pages.sh') }}
          restore-keys: |
            ${{ runner.os }}-formalization-build-v1-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml', '.gitmodules') }}-
            ${{ runner.os }}-formalization-build-v1-
      - name: Show tool versions
        run: |
          lean --version
          lake --version
          python3 --version
          git submodule status || true
      - if: ${{ inputs.warm_dependency_cache }}
        name: Warm Lean dependency cache
        run: |
          lake exe cache get || true
          if [ "${{ inputs.harness_enabled }}" = "true" ] && [ -f "${{ steps.harness.outputs.formalization_path }}/lakefile.lean" ]; then
            (
              cd "${{ steps.harness.outputs.formalization_path }}"
              lake exe cache get || true
            )
          fi
      - if: ${{ inputs.harness_enabled }}
        name: Select harness Lean toolchain
        run: |
          formalization_toolchain="${{ steps.harness.outputs.formalization_path }}/lean-toolchain"
          if [ -f "$formalization_toolchain" ]; then
            cp "$formalization_toolchain" lean-toolchain
          fi
      - if: ${{ inputs.harness_enabled }}
        name: Validate harness contract
        run: python3 tools/verso-harness/scripts/check_harness.py --project-root .
      - name: Build Blueprint site
        run: ./scripts/ci-pages.sh
      - name: Upload site artifact
        uses: actions/upload-artifact@v7
        with:
          name: blueprint-site
          path: _out/site/html-multi
          include-hidden-files: true
          retention-days: 7

  deploy:
    name: Deploy to Cloudflare Pages
    # Fork pull requests cannot read the Cloudflare secrets, so they only build.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name == inputs.production_branch && 'cloudflare-pages' || 'cloudflare-pages-preview' }}
      url: ${{ steps.deploy.outputs.pages-deployment-alias-url || steps.deploy.outputs.deployment-url }}
    steps:
      - name: Download site artifact
        uses: actions/download-artifact@v8
        with:
          name: blueprint-site
          path: site
      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy site
            --project-name=${{ inputs.cloudflare_project_name }}
            --branch=${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
            --commit-hash=${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
            --commit-dirty=true
      - name: Report deployment URL
        run: |
          {
            echo "### Blueprint deployed to Cloudflare Pages"
            echo
            echo "- Deployment: ${{ steps.deploy.outputs.deployment-url }}"
            if [ -n "${{ steps.deploy.outputs.pages-deployment-alias-url }}" ]; then
              echo "- Branch alias: ${{ steps.deploy.outputs.pages-deployment-alias-url }}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
